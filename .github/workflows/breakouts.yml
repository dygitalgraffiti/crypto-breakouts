name: BB band alerts

on:
  schedule:    - cron: "7,22,37,52 * * * *"   # every 15 min (GitHub may run a few minutes late)
  workflow_dispatch: {}

permissions:
  contents: write            # to save state.json

concurrency:
  group: breakouts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check band tags
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOP_N: "100"             # top N Hyperliquid perps by 24h volume
          TIMEFRAMES: "4h,1d"      # any of 1h,2h,4h,8h,12h,1d
          BB_LENGTH: "20"
          BB_MULT: "2"
          CONFLUENCE_ONLY: "false" # "true" = only alert when 4h AND 1D both tag the same band
          EXCLUDE: ""              # e.g. "BTC,ETH" to skip coins you already watch
        run: python breakouts.py

      - name: Grid fill alerts
        if: always()   # still runs if the band check fails
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HL_WALLET: ${{ secrets.HL_WALLET }}
        run: python grid_fills.py

      - name: Save state
        if: always()
        run: |
          git config user.name "breakout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json grid_state.json 2>/dev/null || git add -A
          git diff --cached --quiet || git commit -m "chore: update band state"
          git pull --rebase
          git push
